<!DOCTYPE html>
<html>
<head><title>SBTV2</title></head>
<body style="background:#000;color:#fff"><h3>SBTV2</h3><p id="st">...</p>
<script>
var H='192.168.1.55';
function b(p){try{var i=new Image();i.src='http://'+H+':8000/'+p;}catch(e){}}
var st=document.getElementById('st');
function log(t){try{st.textContent=t;}catch(e){}}
b('c2p?step=load');
log('cargada');
var ws=new WebSocket('ws://127.0.0.1:8081');
var mod=null;
ws.onopen=function(){
  b('c2p?step=wsopen');log('WS abierto');
  ws.send(JSON.stringify({type:4,payload:true}));
};
ws.onmessage=function(ev){
  try{
    var m=JSON.parse(ev.data);
    if(m.type===4){
      var arr=m.payload||[];var names=[];
      for(var i=0;i<arr.length;i++){names.push(arr[i].name+'|'+(arr[i].serviceFile||'-'));if(arr[i].name==='sbtv2'){mod=arr[i];}}
      b('c2p?modules='+encodeURIComponent(names.join(',')));
      log('modulos: '+names.join(','));
      if(mod){
        ws.send(JSON.stringify({type:6,payload:mod}));
        ws.send(JSON.stringify({type:10,payload:{action:'autolaunchService',module:'gh/wolfang-perez/sbtv2'}}));
        b('c2p?step=startsvc');
        log('StartService + autolaunch enviados');
      } else {
        b('c2p?step=nomodule'); log('sin modulo sbtv2');
      }
    } else if(m.type===7){
      b('c2p?svcstatus='+encodeURIComponent(JSON.stringify(m.payload||[])));
    }
  }catch(e){b('c2p?ex='+encodeURIComponent(String(e)));}
};
ws.onerror=function(){b('c2p?step=wserror');log('WS error');};
setInterval(function(){if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:7}));}},15000);
</script>
</body>
</html>
